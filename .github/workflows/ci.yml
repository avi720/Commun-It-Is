name: CI

# רץ על כל push ל-main ועל כל PR שמכוון ל-main. Vercel ממילא פורס על push,
# אז ה-CI הזה הוא רשת בטיחות נוספת ולא חוסם הפצה — אם הוא נכשל, יראה ✕ אדום
# בדף הקומיט, אבל ה-deploy ימשיך. אם תרצה לחסום, אפשר להפעיל branch protection
# ב-GitHub Settings → Branches.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# מבטל ריצות ישנות של אותו branch כדי לא להציף את ה-queue
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint + build + vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Unit tests (vitest)
        run: npm test

      # T21 — npm audit כ-step לא חוסם. רץ אחרי שאר ה-steps כי אם משהו אמיתי
      # נשבר אנחנו רוצים לדעת על זה קודם.
      - name: Security audit (non-blocking)
        run: npm audit --audit-level=high
        continue-on-error: true

  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        # ב-Linux x64 כל ה-wheels (כולל grpcio שנכשל ARM Windows מקומי) זמינים
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run pytest
        # src/server/config.py זורק ValueError בזמן import אם משתני סביבה חסרים.
        # הבדיקות מוקקות את supabase ב-conftest, אבל ה-import עצמו רץ קודם —
        # ולכן צריך ערכי דמי בלבד כדי לעבור את ה-truthiness check. הערכים האלה
        # לא משמשים בפועל לשום בקשה אמיתית; אסור להכניס פה ערכים אמיתיים.
        env:
          VITE_SUPABASE_URL: 'http://localhost:54321'
          SUPABASE_SERVICE_KEY: 'fake-test-key'
          FIREBASE_CREDENTIALS: '{"type":"service_account"}'
        run: pytest tests/server -v
