name: CI

# Runs on PRs targeting main/dev and on push to main. Push to dev is not a trigger:
# dev commits arrive through PRs, so it would run every commit twice. Price: a push
# to a branch with no open PR runs no CI. Job `name:` values are wired into
# Vercel Deployment Checks (GitHub) to hold production promotion until the three test
# jobs pass (frontend, backend, database; not the audit job); see docs/DEPLOY-GATE.md
# for the one-time dashboard setup.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

# מבטל ריצות ישנות של אותו branch כדי לא להציף את ה-queue
concurrency:
  # Never cancel on main: a cancelled run leaves that commit's production deployment
  # unpromoted under Vercel Deployment Checks (docs/DEPLOY-GATE.md). A shared group
  # still drops a queued run when a newer one queues, even with cancel-in-progress
  # off, so each main commit gets its own group.
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  frontend:
    name: Frontend (lint + build + vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Unit tests (vitest)
        run: npm test

  # T21 — dependency audit, production deps only (npm: --omit=dev; Python:
  # requirements.txt, not requirements-dev.txt), so dev tooling never fails a PR.
  # Own job, not one of the Vercel Deployment Checks, so a new advisory or a
  # registry outage turns PRs red but never blocks production promotion.
  audit:
    name: Dependency audit (prod deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: npm audit (production deps)
        run: npm audit --omit=dev --audit-level=high

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: pip-audit (requirements.txt)
        run: |
          python -m pip install pip-audit
          pip-audit -r requirements.txt

  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        # ב-Linux x64 כל ה-wheels (כולל grpcio שנכשל ARM Windows מקומי) זמינים
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run pytest
        # src/server/config.py זורק ValueError בזמן import אם משתני סביבה חסרים.
        # הבדיקות מוקקות את supabase ב-conftest, אבל ה-import עצמו רץ קודם —
        # ולכן צריך ערכי דמי בלבד כדי לעבור את ה-truthiness check. הערכים האלה
        # לא משמשים בפועל לשום בקשה אמיתית; אסור להכניס פה ערכים אמיתיים.
        env:
          VITE_SUPABASE_URL: 'http://localhost:54321'
          SUPABASE_SERVICE_KEY: 'fake-test-key'
          FIREBASE_CREDENTIALS: '{"type":"service_account"}'
        run: pytest tests/server -v

  database:
    name: Database (local Supabase pgTAP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0

      # Local stack only. Do not pass --linked or a project ref — these tests
      # must never touch the hosted database.
      - name: Start local Supabase
        run: supabase start

      - name: Reset database from migrations
        run: supabase db reset

      - name: pgTAP
        run: supabase test db --local
